# Potential production, wheat "Tajan" at Gorgan -- the scenario verified to an
# exact match against the reference output (see tests/test_verification.py).
#
# Values transcribed from SSM_iCrop__2022_05_29.xlsm:
#   Location sheet row 7   (LocRowNo=5 -> row 7)
#   Manag sheet row 17     (MangRowNo=13 -> row 17), "Tajan 1 Arab"
#   Soil sheet rows 28-35  (SoilRowNo=24), "Danesh"
#   Crop sheet column D    -> configs/crops/wheat.yaml
#
# The Run sheet's "Taj1 Arab" scenario is water=3 / nitrogen=2; this file sets
# water=0 / nitrogen=0 to reproduce the "Taj1-Potential" reference scenario.
# The unmodified management is in gorgan_wheat_taj1.yaml.

name: "Taj1-Potential"
crop_file: "../crops/wheat.yaml"

location:
  name: "Gorgan"
  latitude: 36.85
  vpdf: 0.63             # VPD coefficient, Gorgan-specific (Tabriz is 0.75)
  temp_change: 0.0       # tchng
  precip_change: 1.0     # pchng
  co2: 385.0
  weather_file: "../../data/weather/gorgan.csv"

management:
  name: "Tajan 1 Arab"
  fix_find: 0            # fixed sowing date
  plant_year: 2005       # Fyear
  sim_years: 1           # yrno
  sim_doy: 340
  pdoy: 348              # Fpdoy
  lpdoy: 365
  stop_doy: 400          # >365 in the source sheet, i.e. effectively disabled
  sow_tmp: 5.5
  sow_wat: 60.0
  plant_density: 386.0   # Pden
  water: 0               # potential production -- no soil water balance
  nitrogen: 0            # no N balance
  irg_level: 0.5         # IRGLVL, unused while water=0

soil:
  name: "Danesh"
  n_layers: 5            # NLYER -- the sheet has 6 filled rows, VBA uses 5
  ldrain: 5.0
  salb: 0.13
  cn: 73.0               # CN2
  layers:
    # depth_mm | sat | dul | cll | adry | init_water | drainf | N params
