# "Taj1 Arab" exactly as configured in the 2022 source workbook's Run sheet:
# scheduled irrigation (water=3) plus a full N balance (nitrogen=2).
#
# tests/test_verification.py runs it, and with water=1 and irg_level=.inf the
# "Taj1-Nlim" scenario of the verification workbook (see docs/verification.md).
#
# Source: Manag sheet rows 17-32 (MangRowNo=13), Location row 7, Soil rows 28-35.

name: "Taj1 Arab"
crop_file: "../crops/wheat.yaml"
soil_file: "../soils/danesh.yaml"

location:
  name: "Gorgan"
  latitude: 36.85
  vpdf: 0.63
  temp_change: 0.0
  precip_change: 1.0
  co2: 385.0
  weather_file: "../../data/weather/gorgan.csv"

management:
  name: "Tajan 1 Arab"
  fix_find: 0
  plant_year: 2005
  sim_years: 1
  sim_doy: 340
  pdoy: 348
  lpdoy: 365
  stop_doy: 400
  sow_tmp: 5.5
  sow_wat: 60.0
  plant_density: 386.0
  water: 3               # scheduled irrigation
  nitrogen: 2            # full N balance
  irg_level: 0.5         # IRGLVL

  irrigation:
    timing_basis: 1      # WATiT=1 -> DAP-based
    events:
      - {time: 117, amount_mm: 70.0}

  nitrogen_schedule:
    timing_basis: 3      # NATiT=3 -> DOY-based
    # volatilization_fraction is in per cent, as the sheet header "(%)" says:
    # SoilN divides it by 100 (iCrop.vba:1650), although :150 calls VOLFI a
    # "Fraction volatilization". The reference output confirms it: 2.3 g N m-2
    # at 2 % gives NVOL = 0.046 on DOY 348.
    events:
      - {time: 348, amount: 2.3, volatilization_fraction: 2.0}
      - {time: 42,  amount: 2.3, volatilization_fraction: 10.0}
      - {time: 110, amount: 2.3, volatilization_fraction: 10.0}
    # The workbook also fills the automatic-application block (Manag col 12),
    # which NATiT=3 does not read. Kept here because it is the only transcription
    # of those cells; the sheet labels watFRT where iCrop.vba:158 reads FRTWAT.
    auto:
      ntrsh0: 23.0
      nvolf0: 2.0
      bd_bfrt: 4.0
      bd_tfrt: 28.0
      frtwat: 30.0
      ntrsh1: 18.0
      napply1: 7.0
      nvolf1: 10.0
